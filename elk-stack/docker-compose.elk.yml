name: cinehub-elk

# ============================================================
# ELK toi gian: web-1/2/3 -> Filebeat -> Elasticsearch -> Kibana
#
# Chay SAU khi da "docker compose up -d" o thu muc goc:
#   docker compose -f elk-stack/docker-compose.elk.yml up -d
# Kibana: http://localhost:5601   Elasticsearch: http://localhost:9200
#
# Hai stack doc lap: Filebeat doc log qua Docker (file log + docker.sock),
# khong can chung network voi web-1/2/3. Tat ELK thi web van chay binh thuong.
# ============================================================

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    restart: unless-stopped
    environment:
      # Gioi han heap, khong thi ES chiem dan het RAM (cam bay so 8 trong roadmap)
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    volumes:
      - ./elasticsearch/config/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
      - es-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    restart: unless-stopped
    volumes:
      - ./kibana/config/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.0
    restart: unless-stopped
    # root: moi doc duoc file log cua container va docker.sock
    user: root
    # strict.perms=false: file mount tu Windows luon co quyen 777, Filebeat mac dinh tu choi
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./filebeat/weblogs-template.json:/usr/share/filebeat/weblogs-template.json:ro
      # Docker ghi stdout cua moi container ra day (log driver json-file)
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # De biet container nao la web-1/2/3 (doc label cua docker compose)
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Nho da doc den dau, restart khong gui lai log cu
      - filebeat-data:/usr/share/filebeat/data
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  es-data:
  filebeat-data:
