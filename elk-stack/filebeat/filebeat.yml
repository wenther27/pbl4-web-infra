filebeat.autodiscover:
  providers:
    - type: docker
      templates:
        - condition:
            regexp:
              docker.container.name: "^cinehub-infrastructure-(web-[0-9]+|load-balancer|anomaly-detector)-[0-9]+$"
          config:
            - type: filestream
              id: "app-${data.docker.container.id}"
              paths:
                - /var/lib/docker/containers/${data.docker.container.id}/*.log
              parsers:
                - container: ~

processors:
  - decode_json_fields:
      fields: ["message"]
      target: ""
      overwrite_keys: true
      add_error_key: true
  - drop_event:
      when:
        not:
          has_fields: ["logger_name"]
  - drop_fields:
      ignore_missing: true
      fields: ["agent", "ecs", "input", "log", "stream", "appName", "instanceId", "error",
               "docker", "container.id", "container.image", "host"]

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  index: "weblogs-%{+yyyy.MM.dd}"

setup.ilm.enabled: false
setup.template.name: "weblogs"
setup.template.pattern: "weblogs-*"
setup.template.overwrite: true
setup.template.json.enabled: true
setup.template.json.path: "/usr/share/filebeat/weblogs-template.json"
setup.template.json.name: "weblogs"

logging.level: info