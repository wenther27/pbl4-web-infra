name: cinehub-infrastructure

x-mysql-common: &mysql-common
  image: mysql:8.4
  restart: unless-stopped
  environment:
    MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-for-local-development}
    MYSQL_DATABASE: ${MYSQL_DATABASE:-cinehub_db}
    MYSQL_REPL_USER: ${MYSQL_REPL_USER:-repl}
    MYSQL_REPL_PASSWORD: ${MYSQL_REPL_PASSWORD:-change-me-repl-password}
    MYSQL_PRIMARY_HOST: mysql-primary
  networks:
    - cinehub-network

x-web-common: &web-common
  build:
    context: ./web-server/backend
  image: cinehub-backend:local
  restart: unless-stopped
  depends_on:
    mysql-primary:
      condition: service_healthy
    mysql-replica:
      condition: service_healthy
    redis:
      condition: service_started
  environment: &web-env
    DB_PRIMARY_URL: jdbc:mysql://mysql-primary:3306/${MYSQL_DATABASE:-cinehub_db}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8
    DB_REPLICA_URL: jdbc:mysql://mysql-replica:3306/${MYSQL_DATABASE:-cinehub_db}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8
    DB_USER: root
    DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-for-local-development}
    JWT_SECRET: ${JWT_SECRET:-change-this-development-secret-to-at-least-32-characters}
    JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
    SHOW_SQL: ${SHOW_SQL:-false}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
    UPLOAD_MAX_SIZE: ${UPLOAD_MAX_SIZE:-5242880}
    UPLOAD_VIDEO_MAX_SIZE: ${UPLOAD_VIDEO_MAX_SIZE:-524288000}
    SERVER_PORT: 8080
    SPRING_PROFILES_ACTIVE: docker
    JAVA_TOOL_OPTIONS: -Xmx256m -XX:+UseSerialGC
    ES_URL: http://host.docker.internal:9200
    LB_ADMIN_URL: http://load-balancer:8090
    LB_ADMIN_TOKEN: ${LB_ADMIN_TOKEN:-dev-admin-token-doi-di}
    REDIS_HOST: redis
    REDIS_PORT: 6379
    CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-300}
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - cinehub-network
  volumes:
    - cinehub-uploads:/app/uploads

services:
  mysql-primary:
    <<: *mysql-common
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --log-replica-updates=ON
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PRIMARY_PORT:-3307}:3306"
    volumes:
      - mysql-primary-data:/var/lib/mysql
      - ./database/migrations/V1__init_schema.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./database/primary/init/02-create-repl-user.sh:/docker-entrypoint-initdb.d/02-create-repl-user.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  mysql-replica:
    <<: *mysql-common
    command:
      - --server-id=2
      - --relay-log=relay-bin
      - --read-only=ON
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    depends_on:
      mysql-primary:
        condition: service_healthy
    ports:
      - "${MYSQL_REPLICA_PORT:-3308}:3306"
    volumes:
      - mysql-replica-data:/var/lib/mysql
      - ./database/replica/init/01-setup-replication.sh:/docker-entrypoint-initdb.d/01-setup-replication.sh:ro
      - ./database/replica/healthcheck.sh:/usr/local/bin/replica-healthcheck.sh:ro
    healthcheck:
      test: ["CMD", "bash", "/usr/local/bin/replica-healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - cinehub-network

  web-1:
    <<: *web-common
    environment:
      <<: *web-env
      INSTANCE_ID: web-1
    ports:
      - "8081:8080"

  web-2:
    <<: *web-common
    environment:
      <<: *web-env
      INSTANCE_ID: web-2
    ports:
      - "8082:8080"

  web-3:
    <<: *web-common
    environment:
      <<: *web-env
      INSTANCE_ID: web-3
    ports:
      - "8083:8080"

  load-balancer:
    build:
      context: ./load-balancer
    image: pbl4-load-balancer:local
    restart: unless-stopped
    depends_on:
      - web-1
      - web-2
      - web-3
    environment:
      LB_PORT: "8080"
      LB_BACKENDS: "http://web-1:8080,http://web-2:8080,http://web-3:8080"
      LB_STRATEGY: ${LB_STRATEGY:-dwlc}
      LB_TRUST_XFF: "true"
      LB_ADMIN_PORT: "8090"
      LB_ADMIN_TOKEN: ${LB_ADMIN_TOKEN:-dev-admin-token-doi-di}
      LB_NEVER_BLOCK: "172.18.0.1,127.0.0.1"
      LB_RATE_LIMIT_RPS: ${LB_RATE_LIMIT_RPS:-10}
      LB_RATE_LIMIT_BURST: ${LB_RATE_LIMIT_BURST:-20}
      LB_REQUEST_TIMEOUT_SECONDS: "30"
      LB_UPLOAD_TIMEOUT_SECONDS: "600"
      JAVA_TOOL_OPTIONS: -Xmx128m -XX:+UseSerialGC
    ports:
      - "8080:8080"
      - "127.0.0.1:8090:8090"
    networks:
      - cinehub-network

  anomaly-detector:
    build:
      context: ./anomaly-detection
    image: pbl4-anomaly-detector:local
    restart: unless-stopped
    environment:
      ES_URL: "http://host.docker.internal:9200"
      RULES_FILE: /app/rules.yaml
      LB_ADMIN_URL: http://load-balancer:8090
      LB_ADMIN_TOKEN: ${LB_ADMIN_TOKEN:-dev-admin-token-doi-di}
      JAVA_TOOL_OPTIONS: -Xmx96m -XX:+UseSerialGC
    volumes:
      - ./anomaly-detection/src/main/resources/rules.yaml:/app/rules.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - cinehub-network

  ml-ids:
    build:
      context: ./ml-ids
    image: pbl4-ml-ids:local
    restart: unless-stopped
    environment:
      MODEL_DIR: /app/model
    volumes:
      - ./ml-ids/model:/app/model:ro
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - cinehub-network

volumes:
  mysql-primary-data:
  mysql-replica-data:
  cinehub-uploads:

networks:
  cinehub-network:
    driver: bridge