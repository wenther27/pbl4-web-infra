window_seconds: 60
interval_seconds: 10
cooldown_seconds: 300
baseline_minutes: 30

whitelist_ips: []

auto_block:
  enabled: true
  dry_run: false
  rules: [ATTACK_SIGNATURE, BRUTE_FORCE_LOGIN, ML_IDS]
  minutes: 15
  max_per_minute: 10

rules:
  HIGH_RATE_IP:
    enabled: true
    severity: HIGH
    threshold: 100

  SCAN_PATHS:
    enabled: true
    severity: MEDIUM
    threshold: 15

  BRUTE_FORCE_LOGIN:
    enabled: true
    severity: HIGH
    threshold: 10

  ERROR_RATE_5XX:
    enabled: true
    severity: HIGH
    threshold_percent: 5
    min_requests: 20

  HIGH_LATENCY:
    enabled: true
    severity: MEDIUM
    threshold_ms: 1000
    min_requests: 20

  BACKEND_DOWN:
    enabled: true
    severity: HIGH
  TRAFFIC_SPIKE:
    enabled: true
    severity: MEDIUM
    z_threshold: 3
    min_requests: 30
    min_std: 5
    min_history: 10

  ATTACK_SIGNATURE:
    enabled: true
    severity: HIGH
    min_matches: 1
    signatures:
      SQL_INJECTION:
        - '\bunion\b[\s\S]{0,40}\bselect\b'
        - '''\s*(or|and)\s+''?\w+''?\s*=\s*''?\w+'
        - '\b(sleep|benchmark|pg_sleep)\s*\('
        - ';\s*(drop|delete|truncate|insert|update)\s+'
      XSS:
        - '<\s*script'
        - 'javascript\s*:'
        - '\bon(error|load|mouseover)\s*='
      PATH_TRAVERSAL:
        - '\.\./'
        - '\.\.\\'
        - '/etc/(passwd|shadow)'
    user_agent_signatures:
      - '(sqlmap|nikto|nmap|masscan|acunetix|wpscan|dirbuster|gobuster|nuclei)'

  ML_IDS:
    enabled: true
    severity: HIGH
    threshold: 0.782
    min_matches: 1
    timeout_ms: 3000
