# Do dai cua so du lieu: moi lan kiem tra nhin lai bao nhieu giay
window_seconds: 60
# Bao lau kiem tra mot lan
interval_seconds: 10
# Cung luat + cung doi tuong (IP, backend...) da bao thi im lang trong bao lau
cooldown_seconds: 300
# R7: lay bao nhieu phut truoc lam "binh thuong" (baseline)
baseline_minutes: 30

# IP tin cay: khong bao R1, R2 cho cac IP nay (vd: may chay JMeter do tai)
whitelist_ips: []

rules:
  # R1: mot IP gui qua nhieu request trong cua so (DoS, bot cao du lieu)
  HIGH_RATE_IP:
    enabled: true
    severity: HIGH
    threshold: 100            # so request / cua so

  # R2: mot IP nhan 403/404 tren qua nhieu duong dan KHAC NHAU (do quet)
  # 403 vi SecurityConfig co .anyRequest().denyAll()
  SCAN_PATHS:
    enabled: true
    severity: MEDIUM
    threshold: 15             # so duong dan khac nhau / cua so

  # R3: mot IP dang nhap that bai (401) qua nhieu lan
  BRUTE_FORCE_LOGIN:
    enabled: true
    severity: HIGH
    threshold: 10            # so lan 401 tren /api/auth/login / cua so

  # R4: ti le loi 5xx cao (DB chet, loi code, tat ca backend DOWN)
  ERROR_RATE_5XX:
    enabled: true
    severity: HIGH
    threshold_percent: 5      # % request loi 5xx
    min_requests: 20          # it hon so nay thi khong xet (tranh 1/2 = 50%)

  # R5: he thong cham
  HIGH_LATENCY:
    enabled: true
    severity: MEDIUM
    threshold_ms: 1000      # p95 thoi gian phan hoi (ms)
    min_requests: 20

  # R6: LB bao mot backend DOWN
  BACKEND_DOWN:
    enabled: true
    severity: HIGH
  # R7: tong luu luong tang dot bien so voi N phut truoc (z-score)
  TRAFFIC_SPIKE:
    enabled: true
    severity: MEDIUM
    z_threshold: 3            # cao hon trung binh bao nhieu lan do lech chuan
    min_requests: 30          # hien tai < 30 req/phut thi khong xet
    min_std: 5                # san do lech chuan (he thong im lang -> std = 0)
    min_history: 10           # can it nhat 10 phut lich su