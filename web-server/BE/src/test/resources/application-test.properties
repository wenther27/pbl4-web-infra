# Cau hinh rieng cho test: dung H2 in-memory nen chay duoc
# "mvn test" ma khong can bat MySQL/Docker.
spring.application.name=CineHub-BE-Test

spring.datasource.url=jdbc:h2:mem:cinehub;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Test thi sinh schema tu entity (that ra production dung file database/cinehub_db.sql)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.jwt.secret=chuoi-secret-chi-dung-cho-unit-test-dai-toi-thieu-64-ky-tu-de-du-cho-HS512-abcdef
app.jwt.expiration=3600000

app.instance-id=test
app.cors.allowed-origins=http://localhost:5173

logging.level.root=WARN
logging.level.com.example.cinehub=WARN
