spring.application.name=CineHub-BE

app.datasource.primary.url=${DB_PRIMARY_URL:jdbc:mysql://localhost:3307/cinehub_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8}
app.datasource.primary.username=${DB_USER:root}
app.datasource.primary.password=${DB_PASSWORD:change-me-for-local-development}
app.datasource.primary.driver-class-name=com.mysql.cj.jdbc.Driver
app.datasource.primary.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
app.datasource.primary.hikari.minimum-idle=2
app.datasource.primary.hikari.connection-timeout=10000

app.datasource.replica.url=${DB_REPLICA_URL:jdbc:mysql://localhost:3308/cinehub_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8}
app.datasource.replica.username=${DB_USER:root}
app.datasource.replica.password=${DB_PASSWORD:change-me-for-local-development}
app.datasource.replica.driver-class-name=com.mysql.cj.jdbc.Driver
app.datasource.replica.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
app.datasource.replica.hikari.minimum-idle=2
app.datasource.replica.hikari.connection-timeout=10000

spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=${SHOW_SQL:false}

spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.connection.characterEncoding=UTF-8

spring.jpa.properties.hibernate.connection.useUnicode=true

server.servlet.encoding.charset=UTF-8

server.servlet.encoding.enabled=true

server.servlet.encoding.force=true

server.port=${SERVER_PORT:8080}

server.forward-headers-strategy=native

app.jwt.secret=${JWT_SECRET:change-this-development-secret-to-at-least-32-characters}

app.jwt.expiration=${JWT_EXPIRATION:86400000}

app.instance-id=${INSTANCE_ID:local}

# Local image storage. Mount this directory as persistent storage in production.
app.upload.directory=${UPLOAD_DIR:uploads}
app.upload.max-size-bytes=${UPLOAD_MAX_SIZE:5242880}
app.upload.video-max-size-bytes=${UPLOAD_VIDEO_MAX_SIZE:524288000}
# Multipart must allow videos; ImageStorageService still enforces the 5 MB image limit.
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=510MB

management.endpoints.web.exposure.include=health,info

management.endpoint.health.show-details=never

springdoc.api-docs.path=/v3/api-docs

springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}

springdoc.swagger-ui.path=/swagger-ui.html

springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}

springdoc.swagger-ui.operations-sorter=method

springdoc.swagger-ui.tags-sorter=alpha

springdoc.swagger-ui.persist-authorization=true

springdoc.swagger-ui.disable-swagger-default-url=true

springdoc.paths-to-match=/api/**

logging.level.root=INFO

logging.level.com.example.cinehub=${LOG_LEVEL:INFO}

logging.level.com.zaxxer.hikari.HikariConfig=INFO

# Doc day du thong tin tu Load Balancer
server.tomcat.remoteip.host-header=X-Forwarded-Host
server.tomcat.remoteip.port-header=X-Forwarded-Port
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto