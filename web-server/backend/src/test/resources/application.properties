spring.datasource.url=jdbc:h2:mem:cinehub_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.jwt.secret=test-jwt-secret-that-is-at-least-32-characters-long
app.jwt.expiration=86400000
app.upload.directory=target/test-uploads

# DataSourceConfig doc app.datasource.primary/replica (khong doc spring.datasource):
# tro ca hai vao cung mot H2, neu khong replica la DB rong -> query doc loi 500
app.datasource.primary.url=jdbc:h2:mem:cinehub_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
app.datasource.primary.driver-class-name=org.h2.Driver
app.datasource.primary.username=sa
app.datasource.primary.password=
app.datasource.replica.url=jdbc:h2:mem:cinehub_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
app.datasource.replica.driver-class-name=org.h2.Driver
app.datasource.replica.username=sa
app.datasource.replica.password=
